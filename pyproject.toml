[project]
name = "workbench"
version = "0.0.1"
description = "Browser workbench for training runs, image browsing and label curation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "jinja2",
    "nvidia-ml-py",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "pillow",
    "python-dotenv",
]

[project.scripts]
workbench = "workbench.app:main"

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
